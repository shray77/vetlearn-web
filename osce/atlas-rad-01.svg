<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33608C" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#1E3A8A" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#33608C" stroke-opacity="0.15" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg1)"/>
  <rect width="640" height="360" fill="url(#grid1)"/>
  <!-- Ribcage silhouette -->
  <g stroke="#33608C" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M 180 80 Q 320 60 460 80"/>
    <path d="M 200 130 Q 320 110 440 130"/>
    <path d="M 210 180 Q 320 160 430 180"/>
    <path d="M 200 230 Q 320 210 440 230"/>
    <path d="M 190 280 Q 320 260 450 280"/>
    <!-- Diaphragm -->
    <path d="M 180 290 Q 320 330 460 290" stroke="#6D4FC4" stroke-width="3"/>
  </g>
  <!-- Spine -->
  <rect x="312" y="60" width="16" height="240" rx="6" fill="#6D4FC4" opacity="0.7"/>
  <!-- Alveolar pattern (right caudal lobe) -->
  <g fill="#B4531C" opacity="0.5">
    <circle cx="380" cy="220" r="14"/>
    <circle cx="408" cy="240" r="12"/>
    <circle cx="396" cy="260" r="13"/>
    <circle cx="416" cy="200" r="11"/>
  </g>
  <!-- Annotation -->
  <g stroke="#EF4444" stroke-width="2" fill="none">
    <circle cx="400" cy="230" r="40" stroke-dasharray="4 4"/>
    <line x1="440" y1="230" x2="540" y2="180"/>
  </g>
  <text x="540" y="172" font-family="sans-serif" font-size="14" fill="#EF4444" font-weight="bold">Alveolar pattern</text>
  <text x="20" y="345" font-family="sans-serif" font-size="11" fill="#64748B">VetLearn OSCE · radiology · public domain placeholder</text>
</svg>
