<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#FCE7F3"/>
  <!-- Skin layers -->
  <rect x="0" y="60" width="640" height="40" fill="#FBCFE8"/>
  <rect x="0" y="100" width="640" height="180" fill="#F9A8D4" opacity="0.5"/>
  <rect x="0" y="280" width="640" height="40" fill="#FBCFE8"/>
  <!-- Epidermis label -->
  <line x1="0" y1="60" x2="640" y2="60" stroke="#831843" stroke-width="2"/>
  <line x1="0" y1="100" x2="640" y2="100" stroke="#831843" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Plasma cell infiltrate -->
  <g>
    <ellipse cx="200" cy="180" rx="20" ry="14" fill="#9333EA" opacity="0.8"/>
    <circle cx="220" cy="180" r="6" fill="#581C87"/>
    <text x="195" y="220" font-family="sans-serif" font-size="9" fill="#581C87">plasma cell</text>

    <ellipse cx="280" cy="160" rx="22" ry="15" fill="#9333EA" opacity="0.8"/>
    <circle cx="302" cy="160" r="7" fill="#581C87"/>

    <ellipse cx="350" cy="200" rx="20" ry="14" fill="#9333EA" opacity="0.8"/>
    <circle cx="370" cy="200" r="6" fill="#581C87"/>

    <ellipse cx="420" cy="170" rx="22" ry="15" fill="#9333EA" opacity="0.8"/>
    <circle cx="442" cy="170" r="7" fill="#581C87"/>

    <ellipse cx="240" cy="220" rx="20" ry="14" fill="#9333EA" opacity="0.8"/>
    <circle cx="260" cy="220" r="6" fill="#581C87"/>

    <ellipse cx="380" cy="240" rx="22" ry="15" fill="#9333EA" opacity="0.8"/>
    <circle cx="402" cy="240" r="7" fill="#581C87"/>

    <!-- Lymphocyte -->
    <circle cx="320" cy="240" r="8" fill="#7C3AED"/>
    <circle cx="320" cy="240" r="4" fill="#4C1D95"/>

    <!-- Macrophage (larger, foamy) -->
    <circle cx="460" cy="220" r="25" fill="#A855F7" opacity="0.5"/>
    <circle cx="455" cy="215" r="6" fill="#581C87"/>
    <circle cx="470" cy="225" r="5" fill="#581C87"/>
  </g>
  <!-- Ulcer area -->
  <path d="M 100 60 L 130 80 L 160 60 L 190 80 L 220 60" stroke="#DC2626" stroke-width="2" fill="none"/>
  <text x="100" y="40" font-family="sans-serif" font-size="11" fill="#831843" font-weight="bold">Эпидермис (изъязвлён)</text>
  <text x="0" y="120" font-family="sans-serif" font-size="11" fill="#831843">Дерма — плотный плазмоцитарный инфильтрат</text>
  <text x="20" y="345" font-family="sans-serif" font-size="11" fill="#64748B">VetLearn OSCE · histopathology · H&amp;E · public domain placeholder</text>
</svg>
