<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#FCE7F3"/>
  <!-- H&E stain background -->
  <rect x="40" y="40" width="560" height="280" fill="#FBCFE8" opacity="0.4"/>
  <!-- Mammary gland ducts -->
  <g>
    <!-- Tubular structures with multilayered epithelium -->
    <ellipse cx="200" cy="160" rx="50" ry="30" fill="#FECDD3" stroke="#831843" stroke-width="2"/>
    <ellipse cx="200" cy="160" rx="35" ry="20" fill="#FDA4AF"/>
    <ellipse cx="200" cy="160" rx="20" ry="12" fill="#FB7185"/>

    <ellipse cx="320" cy="200" rx="55" ry="32" fill="#FECDD3" stroke="#831843" stroke-width="2"/>
    <ellipse cx="320" cy="200" rx="38" ry="22" fill="#FDA4AF"/>
    <ellipse cx="320" cy="200" rx="22" ry="13" fill="#FB7185"/>

    <ellipse cx="440" cy="170" rx="48" ry="28" fill="#FECDD3" stroke="#831843" stroke-width="2"/>
    <ellipse cx="440" cy="170" rx="33" ry="19" fill="#FDA4AF"/>
    <ellipse cx="440" cy="170" rx="18" ry="11" fill="#FB7185"/>

    <!-- Invasive cords in stroma -->
    <path d="M 130 250 Q 160 240 200 260 L 230 250 L 250 270" stroke="#9F1239" stroke-width="6" fill="none"/>
    <path d="M 400 260 L 440 250 L 470 270 L 500 260" stroke="#9F1239" stroke-width="6" fill="none"/>
  </g>
  <!-- Mitotic figures (dark dots) -->
  <circle cx="200" cy="155" r="3" fill="#1E1B4B"/>
  <circle cx="195" cy="165" r="3" fill="#1E1B4B"/>
  <circle cx="320" cy="195" r="3" fill="#1E1B4B"/>
  <circle cx="325" cy="205" r="3" fill="#1E1B4B"/>
  <circle cx="440" cy="165" r="3" fill="#1E1B4B"/>
  <circle cx="445" cy="175" r="3" fill="#1E1B4B"/>
  <!-- Annotation -->
  <line x1="240" y1="260" x2="240" y2="320" stroke="#9F1239" stroke-width="2"/>
  <text x="180" y="335" font-family="sans-serif" font-size="11" fill="#9F1239" font-weight="bold">Инвазивные тяжи в строме</text>
  <text x="20" y="345" font-family="sans-serif" font-size="11" fill="#64748B">VetLearn OSCE · histopathology · mammary carcinoma · H&amp;E · public domain placeholder</text>
</svg>
