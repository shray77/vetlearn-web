<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#FEF3C7"/>
  <!-- Calf body silhouette -->
  <g fill="#92400E" opacity="0.6">
    <ellipse cx="320" cy="200" rx="200" ry="90"/>
    <!-- Head -->
    <ellipse cx="120" cy="170" rx="40" ry="35"/>
    <!-- Legs -->
    <rect x="180" y="260" width="14" height="70"/>
    <rect x="240" y="260" width="14" height="70"/>
    <rect x="380" y="260" width="14" height="70"/>
    <rect x="440" y="260" width="14" height="70"/>
    <!-- Tail -->
    <path d="M 510 180 Q 540 200 530 240"/>
  </g>
  <!-- Abdominal cavity with air-fluid level -->
  <g>
    <ellipse cx="320" cy="200" rx="160" ry="70" fill="#1E40AF" opacity="0.2"/>
    <!-- Fluid (lower half) -->
    <path d="M 160 200 Q 320 220 480 200 L 480 240 Q 320 260 160 240 Z" fill="#1E40AF" opacity="0.5"/>
    <!-- Gas (upper) -->
    <ellipse cx="320" cy="170" rx="120" ry="25" fill="#FFF" opacity="0.4"/>
    <!-- Air-fluid level line -->
    <line x1="170" y1="200" x2="470" y2="200" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 3"/>
  </g>
  <!-- Annotation -->
  <line x1="320" y1="200" x2="320" y2="120" stroke="#DC2626" stroke-width="2"/>
  <text x="280" y="100" font-family="sans-serif" font-size="13" fill="#DC2626" font-weight="bold">Air-fluid level</text>
  <text x="280" y="118" font-family="sans-serif" font-size="11" fill="#DC2626">→ ileus / obstruction</text>
  <text x="20" y="345" font-family="sans-serif" font-size="11" fill="#64748B">VetLearn OSCE · radiology · calf · public domain placeholder</text>
</svg>
